<div class="app-shell d-flex flex-column min-vh-100 mx-auto">
  <main class="flex-grow-1 px-4 pt-4 pb-6">
    <router-outlet />
  </main>
  <nav class="bottom-nav d-flex border-top bg-white">
    <a routerLink="/recipes" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }" class="text-center text-decoration-none">
      <span class="icon d-block lh-1">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18M5 11V7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v4M4 11l1.5 8a2 2 0 0 0 2 1.5h9a2 2 0 0 0 2-1.5L20 11"/></svg>
      </span>
      <span>Ricette</span>
    </a>
    <a routerLink="/import" routerLinkActive="active" class="text-center text-decoration-none">
      <span class="icon d-block lh-1">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      </span>
      <span>Importa</span>
    </a>
    <a routerLink="/recipes/new" routerLinkActive="active" class="text-center text-decoration-none">
      <span class="icon d-block lh-1">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </span>
      <span>Nuova</span>
    </a>
  </nav>
</div>
